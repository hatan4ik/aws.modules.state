name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root module declares configuration_aliases = [aws.replica]. A root module
  # cannot configure the provider it expects a caller to pass, so the shared
  # workflow's unconditional `terraform validate` fails here with "Provider
  # configuration not present" (the reason commit 940cd58 skipped validate for
  # alias modules). This job therefore mirrors the shared workflow's steps, minus
  # the standalone validate, plus the checks specific to this module. Its action
  # commits are pinned independently of the shared workflow: Dependabot bumps
  # them here, so they can run ahead of the pins in terraform-pipelines. Bring
  # the two in line when either side moves a major version; a step that behaves
  # differently between the pins is a reason to re-align, not to diverge. Every example calls the root through real provider
  # wiring, so validating the examples below validates the whole root.
  # Return to the shared workflow once terraform-pipelines skips validate for
  # modules that declare configuration_aliases.
  root:
    name: quality (.)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Check canonical formatting
        run: terraform fmt -check -recursive -no-color

      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Lint Terraform
        run: |
          tflint --init
          tflint

      - name: Run credential-free Terraform tests
        run: terraform test -no-color

      - name: Check the destroy guards
        run: scripts/check-destroy-guards.sh

      - name: Run the wiring suite against a guard-lifted copy
        run: scripts/test-wired.sh

      - name: Run Checkov policy checks
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # pinned upstream commit
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          download_external_modules: false

      - name: Run Trivy IaC checks
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # pinned upstream commit
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Check generated module documentation
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"
          git-push: "false"

  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          - modules/policies
          - modules/legacy-adoption
          - examples/minimal
          - examples/replicated-tier
          - examples/object-lock-tier
          - examples/multiple-tiers
          - examples/legacy-adoption
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@8fc2a04c7931dd449097bb92b15b085278e3f67a # v0.1.1
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true
